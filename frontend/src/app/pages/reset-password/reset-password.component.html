<div class="login-wrap">
  <div class="login-card">
    <h1>Reset Password</h1>

    <ng-container *ngIf="!done">
      <label>New Password <span class="required-mark">*</span></label>
      <input type="password" [(ngModel)]="password" [class.invalid]="submitted && password.length < 8" />

      <label style="margin-top:1rem">Confirm Password <span class="required-mark">*</span></label>
      <input type="password" [(ngModel)]="confirm" [class.invalid]="submitted && password !== confirm" (keyup.enter)="submit()" />

      <div class="field-error" *ngIf="error">{{ error }}</div>

      <button class="btn" (click)="submit()" [disabled]="loading" style="width:100%;margin-top:1.5rem">
        {{ loading ? 'Resetting…' : 'Reset Password' }}
      </button>
    </ng-container>

    <div class="server-note" *ngIf="done">Password updated. Redirecting to login…</div>

    <a routerLink="/login" class="back-link">← Back to login</a>
  </div>
</div>

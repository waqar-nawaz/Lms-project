<h1 class="page-title">Audit Log</h1>

<div class="card">
  <table class="data-table">
    <thead><tr><th>When</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead>
    <tbody>
      <tr *ngFor="let l of logs">
        <td style="white-space:nowrap">{{ l.created_at | date:'short' }}</td>
        <td>{{ l.user_name || 'System' }}</td>
        <td><span class="badge">{{ l.action }}</span></td>
        <td>{{ l.entity_type }}</td>
        <td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          {{ l.new_values ? (l.new_values | json) : '' }}
        </td>
      </tr>
    </tbody>
  </table>
  <div class="empty-state" *ngIf="!logs.length">No audit activity yet.</div>
</div>

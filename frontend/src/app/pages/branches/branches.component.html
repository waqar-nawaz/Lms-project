<h1 class="page-title">Branches</h1>

<div class="toolbar">
  <button class="btn" (click)="openForm()">+ New Branch</button>
</div>

<div class="card" *ngIf="showForm">
  <h3 style="margin-top:0">{{ editingId ? 'Edit Branch' : 'New Branch' }}</h3>
  <div class="field-row">
    <div>
      <label>Name <span class="required-mark">*</span></label>
      <input [(ngModel)]="form.name" [class.invalid]="submitted && !form.name" />
    </div>
    <div>
      <label>Code <span class="required-mark">*</span></label>
      <input [(ngModel)]="form.code" [class.invalid]="submitted && !form.code" />
    </div>
    <div><label>Phone</label><input [(ngModel)]="form.phone" /></div>
  </div>
  <div class="field-row" style="margin-top:0.75rem">
    <div style="flex:2"><label>Address</label><input [(ngModel)]="form.address" /></div>
    <div *ngIf="editingId">
      <label>Status</label>
      <select [(ngModel)]="form.active">
        <option [ngValue]="true">Active</option>
        <option [ngValue]="false">Inactive</option>
      </select>
    </div>
  </div>

  <div class="field-error" *ngIf="error">{{ error }}</div>

  <div class="toolbar" style="margin-top:1rem">
    <button class="btn" (click)="submit()" [disabled]="saving">{{ saving ? 'Saving…' : (editingId ? 'Update' : 'Save') }}</button>
    <button class="btn btn-outline" (click)="showForm = false">Cancel</button>
  </div>
</div>

<div class="card">
  <table class="data-table">
    <thead><tr><th>Name</th><th>Code</th><th>Address</th><th>Staff</th><th>Patients</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr *ngFor="let b of branches">
        <td>{{ b.name }}</td>
        <td>{{ b.code }}</td>
        <td>{{ b.address || '-' }}</td>
        <td>{{ b.user_count }}</td>
        <td>{{ b.patient_count }}</td>
        <td><span class="badge" [class.status-completed]="b.active" [class.status-rejected]="!b.active">{{ b.active ? 'Active' : 'Inactive' }}</span></td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm btn-outline" (click)="openEditForm(b)">Edit</button>
          <button class="btn btn-sm" [class.btn-danger]="b.active" (click)="toggleActive(b)">{{ b.active ? 'Deactivate' : 'Reactivate' }}</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="empty-state" *ngIf="!branches.length">Only one branch so far.</div>
</div>

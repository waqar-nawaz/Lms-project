<div class="login-wrap">
  <div class="login-card">
    <h1>Forgot Password</h1>
    <p class="subtitle">We'll send a reset link if the email is registered.</p>

    <ng-container *ngIf="!done">
      <label>Email <span class="required-mark">*</span></label>
      <input type="email" [(ngModel)]="email" [class.invalid]="submitted && !email" (keyup.enter)="submit()" />
      <div class="field-error" *ngIf="submitted && !email">Email is required</div>

      <button class="btn" (click)="submit()" [disabled]="loading" style="width:100%;margin-top:1.5rem">
        {{ loading ? 'Sending…' : 'Send Reset Link' }}
      </button>
    </ng-container>

    <div class="server-note" *ngIf="done">{{ message }}</div>

    <a routerLink="/login" class="back-link">← Back to login</a>
  </div>
</div>

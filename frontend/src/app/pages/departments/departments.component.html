<h1 class="page-title">Departments</h1>

<div class="toolbar">
  <button class="btn" (click)="openForm()">+ New Department</button>
</div>

<div class="card" *ngIf="showForm">
  <h3 style="margin-top:0">{{ editingId ? 'Edit Department' : 'New Department' }}</h3>
  <div class="field-row">
    <div>
      <label>Name <span class="required-mark">*</span></label>
      <input [(ngModel)]="form.name" [class.invalid]="submitted && !form.name" />
    </div>
    <div>
      <label>Code <span class="required-mark">*</span></label>
      <input [(ngModel)]="form.code" [class.invalid]="submitted && !form.code" />
    </div>
    <div *ngIf="editingId">
      <label>Status</label>
      <select [(ngModel)]="form.active">
        <option [ngValue]="true">Active</option>
        <option [ngValue]="false">Inactive</option>
      </select>
    </div>
  </div>

  <div class="field-error" *ngIf="error">{{ error }}</div>

  <div class="toolbar" style="margin-top:1rem">
    <button class="btn" (click)="submit()" [disabled]="saving">{{ saving ? 'Saving…' : (editingId ? 'Update' : 'Save') }}</button>
    <button class="btn btn-outline" (click)="showForm = false">Cancel</button>
  </div>
</div>

<div class="card">
  <table class="data-table">
    <thead><tr><th>Name</th><th>Code</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr *ngFor="let d of departments">
        <td>{{ d.name }}</td>
        <td>{{ d.code }}</td>
        <td><span class="badge" [class.status-completed]="d.active" [class.status-rejected]="!d.active">{{ d.active ? 'Active' : 'Inactive' }}</span></td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm btn-outline" (click)="openEditForm(d)">Edit</button>
          <button class="btn btn-sm" [class.btn-danger]="d.active" (click)="toggleActive(d)">{{ d.active ? 'Deactivate' : 'Reactivate' }}</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="empty-state" *ngIf="!departments.length">No departments yet.</div>
</div>

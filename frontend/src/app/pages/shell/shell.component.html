<div class="shell">
  <header class="mobile-topbar">
    <button class="hamburger" (click)="toggleMenu()" aria-label="Menu">☰</button>
    <span class="brand">LabTrack</span>
  </header>

  <div class="overlay" *ngIf="menuOpen" (click)="toggleMenu()"></div>

  <aside class="sidebar" [class.open]="menuOpen">
    <div class="brand desktop-only">LabTrack</div>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/patients" routerLinkActive="active">Patients</a>
      <a routerLink="/orders" routerLinkActive="active">Orders</a>
      <a routerLink="/samples" routerLinkActive="active">Samples</a>
      <a routerLink="/tests" routerLinkActive="active">Test Catalog</a>
    </nav>
    <div class="user-box" *ngIf="auth.currentUser() as u">
      <div class="name">{{ u.name }}</div>
      <div class="role">{{ u.role.replace('_', ' ') }}</div>
      <button (click)="auth.logout()">Log out</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

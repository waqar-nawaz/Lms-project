<div class="login-wrap">
  <form class="login-card" (ngSubmit)="submit()">
    <h1>LabTrack LMS</h1>
    <p class="subtitle">Laboratory Management System</p>

    <label>Email <span class="required-mark">*</span></label>
    <input type="email" name="email" [(ngModel)]="email" [class.invalid]="submitted && !email" autofocus />
    <div class="field-error" *ngIf="submitted && !email">Email is required</div>

    <label>Password <span class="required-mark">*</span></label>
    <input type="password" name="password" [(ngModel)]="password" [class.invalid]="submitted && !password" />
    <div class="field-error" *ngIf="submitted && !password">Password is required</div>

    <div class="error" *ngIf="error">{{ error }}</div>

    <button type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign in' }}</button>

    <div class="hint">
      Demo accounts (password: <code>password123</code>): admin, manager, reception,
      phlebotomist, tech, pathologist, accountant &#64;demo.lab
    </div>
  </form>
</div>
